<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Átomo - Editor 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    color: #ccc;
  }
  h1 {
    font-size: 2.5rem;
    color: #88aaff;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  p {
    color: rgba(255,255,255,0.5);
    margin-bottom: 40px;
    font-size: 14px;
  }
  .links {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 32px 40px;
    background: rgba(15, 15, 25, 0.95);
    border: 1px solid rgba(100, 130, 255, 0.3);
    border-radius: 16px;
    color: #ccc;
    text-decoration: none;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  a:hover {
    background: rgba(100, 130, 255, 0.15);
    border-color: rgba(100, 130, 255, 0.6);
    color: #fff;
    transform: translateY(-2px);
  }
  a .icon { font-size: 2.5rem; }
  a .label { font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
  <h1>⚛️ Átomo</h1>
  <p>Editor 3D de modelos atómicos</p>
  <div class="links">
    <a href="atomo-editor.html">
      <span class="icon">🎨</span>
      <span class="label">Editor 3D</span>
    </a>
    <a href="atomo.html">
      <span class="icon">👁️</span>
      <span class="label">Visor Neon1</span>
    </a>
  </div>
</body>
</html>
